version: '3.8'

services:
  service-b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-b
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - JAVA_OPTS=-Xmx512m -Xms256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - sbxservice-network

networks:
  sbxservice-network:
    driver: bridge
