version: '3.8'

services:
  service-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-a
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - JAVA_OPTS=-Xmx512m -Xms256m
      - APP_HTTP_CLIENT_BASE_URL=http://service-b:8082
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks:
      - sbxservice-network

networks:
  sbxservice-network:
    driver: bridge
